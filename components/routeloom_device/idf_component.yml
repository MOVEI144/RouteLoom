# ESP-IDF Component Manager manifest for the device component.
# Mirrors the CMake REQUIRES: routeloom_espnow (runtime + security owner +
# sdkv1 stores), plus the IDF builtins nvs_flash, esp_wifi, esp_timer,
# freertos, esp_driver_usb_serial_jtag and app_update.
name: routeloom/routeloom_device
version: 2.0.0-dev
description: >-
  RouteLoom Device: the one ESP-IDF boot path (NVS, boot session, sdkv1
  stores, security owner, ESP-NOW runtime, USB bridge on gateways) on a
  dedicated Owner task, the SDK Kconfig, and the application facade
  (send, send_group, cancel, delivery, post, capabilities).
url: https://github.com/MOVEI144/RouteLoom
repository: https://github.com/MOVEI144/RouteLoom.git
issues: https://github.com/MOVEI144/RouteLoom/issues
license: Apache-2.0
tags:
  - mesh
  - espnow
  - routeloom
targets:
  - esp32c3
  - esp32s3
  - esp32c5
  - esp32c6
dependencies:
  idf: ">=6.0"
  routeloom/routeloom_espnow:
    path: ../routeloom_espnow
