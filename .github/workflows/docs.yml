name: Documentation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check documentation and parameters
        run: python3 tools/check_docs.py --report doc-check-results.json
      - name: Check generated reference tables
        run: python3 tools/sync_reference_tables.py --check
      - name: Check selected design contracts
        run: python3 tools/check_review_contracts.py --report review-contract-results.json
      - name: Test small contract models and negative documentation mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee contract-test-results.txt
      - name: Create documentation snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile('routeloom-docs.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in paths:
                  if name and Path(name).is_file():
                      archive.write(name, name)
              for name in ('doc-check-results.json', 'review-contract-results.json', 'contract-test-results.txt'):
                  archive.write(name, name)
          PY
      - name: Upload validation and snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: routeloom-documentation
          path: |
            doc-check-results.json
            review-contract-results.json
            contract-test-results.txt
            routeloom-docs.zip
          retention-days: 30
