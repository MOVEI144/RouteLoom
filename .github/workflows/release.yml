name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag matching the checked-out manifest (or final tag for promotion)'
        required: true
        type: string
      dry_run:
        description: 'Build and verify all artifacts without creating a draft release'
        default: true
        type: boolean
      promote_from:
        description: 'Existing RC release tag; promotion copies its exact assets without rebuilding'
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ !inputs.promote_from }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      idf_image: ${{ steps.plan.outputs.idf_image }}
      idf_commit: ${{ steps.plan.outputs.idf_commit }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - id: plan
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 tools/gen_manifest.py --check
          python3 tools/release.py matrix --tag "$TAG" > plan.json
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os
          plan = json.load(open('plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('matrix=' + json.dumps({'include': plan['include']}), file=out)
              print('tag=' + os.environ['TAG'], file=out)
              print('idf_image=espressif/idf:' + plan['toolchain']['esp_idf_tag'], file=out)
              print('idf_commit=' + plan['toolchain']['esp_idf_commit'], file=out)
              print('rust=' + plan['toolchain']['rust'], file=out)
          PY
  source:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - env:
          TAG: ${{ needs.prepare.outputs.tag }}
          RUST: ${{ needs.prepare.outputs.rust }}
        run: |
          rustup toolchain install "$RUST" --profile minimal
          (cd host && cargo +"$RUST" metadata --format-version 1 --locked) > cargo-metadata.json
          python3 -m unittest discover -s tests -p "test_vendored_sources.py"
          python3 -m unittest discover -s tests -p "test_release*.py"
          python3 tools/check.py compat
          python3 tools/release.py source --tag "$TAG" --out dist
          python3 tools/release.py inventory --tag "$TAG" --metadata cargo-metadata.json --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-source-inventory
          path: dist/*
          retention-days: 90
  host:
    needs: [prepare, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-source-inventory
          path: license-inventory
      - env:
          TAG: ${{ needs.prepare.outputs.tag }}
          RUST: ${{ needs.prepare.outputs.rust }}
        run: |
          rustup toolchain install "$RUST" --profile minimal
          (cd host && cargo +"$RUST" build --workspace --release --locked)
          stage="routeloom-${TAG}-linux-x86_64"
          mkdir -p "dist/$stage"
          cp host/target/release/routeloom-host host/target/release/routeloomctl \
             host/target/release/routeloom-tui host/Cargo.lock license-inventory/LICENSE \
             license-inventory/NOTICE license-inventory/THIRD_PARTY_LICENSES.txt "dist/$stage/"
          tar -C dist -czf "dist/${stage}.tar.gz" "$stage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-host
          path: dist/*.tar.gz
          retention-days: 90
  firmware:
    needs: [prepare, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    container:
      image: ${{ needs.prepare.outputs.idf_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Build and RAM-gate firmware
        shell: bash
        env:
          IDF_COMMIT: ${{ needs.prepare.outputs.idf_commit }}
          ENTRY: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "$IDF_COMMIT"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          entry = json.loads(os.environ['ENTRY'])
          project = Path('firmware') / entry['app']
          subprocess.run(['idf.py', 'set-target', entry['target']], cwd=project, check=True)
          with (project / 'sdkconfig').open('a') as out:
              out.write('\n' + '\n'.join(entry['overlay']) + '\n')
          subprocess.run(['idf.py', 'build'], cwd=project, check=True)
          subprocess.run(['idf.py', 'size', '--format', 'json2', '--output-file', 'build/size.json'],
                         cwd=project, check=True)
          subprocess.run(['python3', 'tools/firmware_ram_report.py', str(project / 'build/size.json'),
                          '--target', entry['target'], '--app', entry['app'], '--cell', entry['id'],
                          '--json-out', str(project / 'build/ram-report.json')], check=True)
          # Base bridge/relay releases retain the CI ratchets as well as the hard RAM floor.
          if entry['role'] != 'endpoint':
              report = json.loads((project / 'build/ram-report.json').read_text())
              report['cell'] = entry['cell']
              (project / 'build/ram-report.json').write_text(json.dumps(report))
              subprocess.run(['python3', 'tools/check.py', 'size', '--cell', entry['cell']], check=True)
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-source-inventory
          path: license-inventory
      - name: Inspect and package firmware
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          APP: ${{ matrix.app }}
          RELEASE_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          stage="dist/firmware-stage"
          python3 tools/release_firmware.py "firmware/$APP/build" "firmware/$APP/sdkconfig" \
            "$stage" --release-id "$RELEASE_ID" --tag "$TAG"
          cp license-inventory/LICENSE license-inventory/NOTICE \
             license-inventory/THIRD_PARTY_LICENSES.txt "$stage/"
          find "$stage" -mindepth 1 -maxdepth 1 -printf '%f\0' | sort -z > dist/files.list
          tar -C "$stage" -czf "dist/routeloom-${TAG}-firmware-${RELEASE_ID}.tar.gz" \
            --null -T dist/files.list
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-firmware-${{ matrix.id }}
          path: dist/*.tar.gz
          retention-days: 90
  assemble:
    needs: [prepare, source, host, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 tools/release.py finalize --tag "$TAG" --out dist
      - name: Optional maintainer-selected signing hook
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
          HOOK: ${{ vars.RELEASE_SIGN_HOOK }}
        run: |
          set -euo pipefail
          if [ -n "$KEY" ] || [ -n "$HOOK" ]; then
            test -n "$HOOK"
            key="$RUNNER_TEMP/release-key.pem"
            trap 'rm -f "$key"' EXIT
            key_args=()
            if [ -n "$KEY" ]; then
              umask 077
              printf '%s' "$KEY" > "$key"
              key_args=(--key "$key")
            fi
            python3 tools/release.py sign --out dist --hook "$HOOK" "${key_args[@]}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-assets
          path: dist/*
          retention-days: 90
      - name: Create draft candidate release
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 tools/release.py verify --out dist
          gh release create "$TAG" --draft --title "RouteLoom $TAG" \
            --notes-file docs/releases.md dist/*
  promote:
    if: ${{ inputs.promote_from }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM: ${{ inputs.promote_from }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          gh release download "$FROM" --dir dist
          test "$(git rev-parse "$FROM^{commit}")" = "$(git rev-parse HEAD)"
          python3 tools/release.py promote --out dist --from-tag "$FROM" --tag "$TAG" --commit "$(git rev-parse HEAD)"
          if [ "$DRY_RUN" != true ]; then
            gh release create "$TAG" --draft --title "RouteLoom $TAG" \
              --notes "Promoted unchanged from $FROM after H4; original RC filenames and provenance retained." dist/*
          fi
