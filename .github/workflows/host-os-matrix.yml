name: Host OS Matrix (macOS, Windows, Linux)

on:
  push:
    branches: [main]
    paths:
      - 'host/**'
      - '.github/workflows/host-os-matrix.yml'
  pull_request:
    paths:
      - 'host/**'
      - '.github/workflows/host-os-matrix.yml'

permissions:
  contents: read

jobs:
  host-matrix:
    name: host / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    defaults:
      run:
        working-directory: host
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Rust toolchain (1.85.0)
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy rustfmt
          rustup default 1.85.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build C++ peer for Unix interop tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .. -B ../build-host-os -DROUTELOOM_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build ../build-host-os --parallel 2 --target routeloom_joiner_interop_peer

      - name: Test workspace
        env:
          ROUTELOOM_OWNER_PEER: ${{ github.workspace }}/build-host-os/tests/cpp/routeloom_joiner_interop_peer
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Package Unix host binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="routeloom-host-${{ runner.os }}-${{ runner.arch }}"
          mkdir -p "dist/$stage"
          cp target/release/routeloom-host target/release/routeloomctl target/release/routeloom-tui "dist/$stage/"
          cp Cargo.lock ../LICENSE ../NOTICE "dist/$stage/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"

      - name: Package Windows host binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "routeloom-host-${{ runner.os }}-${{ runner.arch }}"
          New-Item -ItemType Directory -Force "dist/$stage" | Out-Null
          Copy-Item target/release/routeloom-host.exe,target/release/routeloomctl.exe,target/release/routeloom-tui.exe,Cargo.lock,../LICENSE,../NOTICE "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"

      - name: Upload host package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-${{ runner.os }}-${{ runner.arch }}
          path: |
            host/dist/*.tar.gz
            host/dist/*.zip
          retention-days: 30
