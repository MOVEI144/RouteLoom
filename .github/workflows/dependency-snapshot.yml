name: Host dependency snapshot
on:
  push:
    branches: [implementation/core-fixed-250]
    paths: [.github/workflows/dependency-snapshot.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch pinned dependency sources
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          mkdir -p /tmp/rl-host-deps/src
          cd /tmp/rl-host-deps
          printf '[package]\nname="rl-host-deps"\nversion="0.1.0"\nedition="2021"\n[dependencies]\nring="=0.17.14"\nlibc="=0.2.177"\n' > Cargo.toml
          echo 'fn main() {}' > src/main.rs
          cargo +1.85.1 fetch
          tar -C "$HOME/.cargo" -czf /tmp/cargo-cache.tar.gz registry
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-host-dependencies
          path: /tmp/cargo-cache.tar.gz
          retention-days: 1
