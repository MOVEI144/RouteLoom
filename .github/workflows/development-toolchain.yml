name: Development toolchain snapshot
on:
  push:
    branches: [implementation/core-fixed-250]
    paths: [.github/workflows/development-toolchain.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Package compiler and standard library
        run: tar -C "$HOME/.rustup/toolchains/1.85.1-x86_64-unknown-linux-gnu" -czf rust-toolchain.tar.gz bin lib libexec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-toolchain-1.85.1
          path: rust-toolchain.tar.gz
          retention-days: 1
