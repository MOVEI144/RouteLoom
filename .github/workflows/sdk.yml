name: SDK build and tests
on:
  push:
    branches:
      - main
      - implementation/core-fixed-250
      - implementation/pre-hil-software
      - design/autonomous-mesh-issues-3-4-5
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [OFF, ON]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and test portable C/C++ SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.compiler }}' = clang ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          cmake -S . -B build -DROUTELOOM_BUILD_TESTS=ON -DROUTELOOM_ENABLE_SANITIZERS=${{ matrix.sanitizer }} -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure | tee ctest-report-${{ matrix.compiler }}-san${{ matrix.sanitizer }}.txt
      - name: C++ test inventory
        if: always()
        shell: bash
        run: |
          {
            echo '### Portable C++ test targets'
            echo ''
            echo 'Covers: wire codec, wire golden vectors (valid + invalid), routing'
            echo '(3hop/diamond/10hop/partition-merge/loop-freedom), authority ledger'
            echo 'power-cut, USB codec/session/credit, power coordinator model,'
            echo 'replay/end-protection hardening, C ABI, autonomy codecs + golden'
            echo 'vectors, neighbor discovery, congestion scheduler/BUSY, channel-plan'
            echo 'coordinator, migration engine + wire transport, load-aware routing.'
            echo ''
            echo '```'
            ctest --test-dir build -N || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Documentation and contract tests
        run: |
          python3 tools/check_docs.py
          python3 tools/sync_reference_tables.py --check
          python3 tools/check_review_contracts.py
          python3 -m unittest discover -s tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-report-${{ matrix.compiler }}-san${{ matrix.sanitizer }}
          path: ctest-report-*.txt
          retention-days: 30
  wire-golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: C++ wire, USB and SDK v1 golden-vector tests (valid + invalid)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DROUTELOOM_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel 2 --target routeloom_golden_tests routeloom_usb_tests routeloom_key_schedule_tests routeloom_sdkv1_golden_tests routeloom_sdkv1_ead_tests routeloom_sdkv1_join_transport_tests
          ctest --test-dir build --output-on-failure -R 'routeloom_(golden|usb|key_schedule|sdkv1_golden|sdkv1_ead|sdkv1_join_transport)_tests'
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
      - name: Rust wire and USB golden-vector tests
        working-directory: host
        run: cargo test -p routeloom-wire -p routeloom-protocol -p routeloom-keysched
      - name: Rust SDK v1 golden vectors (RFC 6979 re-sign must match)
        working-directory: host
        run: cargo test -p routeloom-provision --test sdkv1_golden
      - name: Rust SDK v1 join EAD vectors (Site Authority re-issue must match)
        working-directory: host
        run: cargo test -p routeloom-join
      - name: Regenerate shared vectors and require byte-identical files
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path host/Cargo.toml -p routeloom-wire --example gen_golden
          cargo run --manifest-path host/Cargo.toml -p routeloom-protocol --example gen_usb_golden
          cargo run --manifest-path host/Cargo.toml -p routeloom-provision --example gen_provisioning_golden
          python3 tools/gen_autonomy_vectors.py
          python3 tools/gen_sdkv1_derivation_vectors.py
          python3 tools/gen_sdkv1_vectors.py
          python3 tools/gen_sdkv1_ead_vectors.py
          python3 tools/gen_sdkv1_join_transport_vectors.py
          git diff --exit-code -- protocol/golden protocol/usb-golden protocol/autonomy-golden protocol/provisioning-golden protocol/sdkv1-golden tests/fuzz/corpus/sdkv1_ead tests/fuzz/corpus/sdkv1_join
          # git diff ignores untracked files: a generator that starts
          # emitting an unreviewed vector must fail too.
          test -z "$(git status --porcelain -- protocol/sdkv1-golden protocol/usb-golden tests/fuzz/corpus/sdkv1_ead tests/fuzz/corpus/sdkv1_join)"
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c3, esp32s3, esp32c5]
        # deep_sleep compiles the CONFIG_ROUTELOOM_DEEP_SLEEP=y path
        # (espnow_power hooks + gated code in main.cpp) — compile-time
        # validation only, not a hardware power claim.
        profile: [normal, deep_sleep]
        # bridge_node exposes the portable UsbBridge on USB Serial/JTAG.
        # It has no deep-sleep variant, so that combination is excluded.
        app: [reference_node, bridge_node]
        # autonomy=observe compiles the EXPERIMENTAL autonomy lane:
        # RLD1 discovery + the migration participant in Observe mode
        # (CONFIG_ROUTELOOM_DISCOVERY=y, CONFIG_ROUTELOOM_MIGRATION=1).
        # Compile-time coverage only — not RF validation, and Observe never
        # moves the radio. AutoGuarded stays opt-in (no kconfig exposes it).
        autonomy: [off]
        # features selects the scope-gateway-config opt-ins (P6):
        #   endpoints_on     — bridge_node with the USB capability bits
        #                      gateway_endpoint_v1 (bit3) + config_endpoint_v1
        #                      (bit4) set, so both endpoints attach.
        #   config_target_on — reference_node with CONFIG_ROUTELOOM_CONFIG=y,
        #                      the NVS-journal ConfigTarget path.
        #   route_scoped     — CONFIG_ROUTELOOM_ROUTE_GATEWAY_SCOPED=y (issue
        #                      #41 gateway-scoped routing profile, 5 s tick /
        #                      90 s lease defaults; the bridge lists itself,
        #                      the reference node names gateway 0x1).
        # The base matrix keeps every feature OFF (defaults), so both
        # branches compile. Compile-time coverage only — never a hardware
        # or qualification claim.
        features: [off]
        exclude:
          - app: bridge_node
            profile: deep_sleep
        include:
          - app: bridge_node
            target: esp32c3
            profile: normal
            autonomy: observe
            features: off
          - app: bridge_node
            target: esp32c3
            profile: normal
            autonomy: off
            features: endpoints_on
          - app: reference_node
            target: esp32c3
            profile: normal
            autonomy: off
            features: config_target_on
          # maintenance_on compiles the factory maintenance-console branch
          # (CONFIG_ROUTELOOM_MAINTENANCE_CONSOLE=y, sdk-v1/07 §6 P7):
          # pre-RF console instead of the mesh. Compile-time coverage
          # only — the console's behavior is host-tested, and enabling it
          # in a field build is never correct.
          - app: reference_node
            target: esp32c3
            profile: normal
            autonomy: off
            features: maintenance_on
          - app: reference_node
            target: esp32c3
            profile: normal
            autonomy: off
            features: route_scoped
          - app: bridge_node
            target: esp32c3
            profile: normal
            autonomy: off
            features: route_scoped
          # Paired bench cells: two ESP32-C3 boards flashed as a real
          # 2-node mesh (static neighbor + RLD1 discovery lane running
          # alongside). autonomy=discover enables CONFIG_ROUTELOOM_DISCOVERY
          # without the migration lane. The PEER_MAC values are the bench
          # boards' hardware MACs — dev fixtures, not secrets.
          - app: bridge_node
            target: esp32c3
            profile: normal
            autonomy: discover
            features: paired_bridge
          - app: reference_node
            target: esp32c3
            profile: normal
            autonomy: discover
            features: paired_target
    container:
      image: espressif/idf:v6.0.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build fixed-IDF reference firmware
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          git -C "$IDF_PATH" rev-parse HEAD | tee idf-commit.txt
          test "$(cat idf-commit.txt)" = 76f5dedd9950a3012fee8fb7d5586df21fc67802
          cd firmware/${{ matrix.app }}
          idf.py set-target '${{ matrix.target }}'
          if [ '${{ matrix.profile }}' = deep_sleep ]; then
            printf 'CONFIG_ROUTELOOM_DEEP_SLEEP=y\n' >> sdkconfig
          fi
          if [ '${{ matrix.autonomy }}' = observe ]; then
            printf 'CONFIG_ROUTELOOM_DISCOVERY=y\nCONFIG_ROUTELOOM_MIGRATION=1\n' >> sdkconfig
          fi
          if [ '${{ matrix.autonomy }}' = discover ]; then
            printf 'CONFIG_ROUTELOOM_DISCOVERY=y\n' >> sdkconfig
          fi
          if [ '${{ matrix.features }}' = paired_bridge ]; then
            # Bench pair node 1: USB gateway/bridge talking to node 2.
            printf 'CONFIG_ROUTELOOM_CAPABILITY=0x1f\n' >> sdkconfig
            printf 'CONFIG_ROUTELOOM_NODE_ID=0x1\n' >> sdkconfig
            printf 'CONFIG_ROUTELOOM_PEER_NODE_ID=0x2\n' >> sdkconfig
            printf 'CONFIG_ROUTELOOM_PEER_MAC="94:a9:90:7a:b5:60"\n' >> sdkconfig
          fi
          if [ '${{ matrix.features }}' = paired_target ]; then
            # Bench pair node 2: reference node carrying the RCC1 journal.
            printf 'CONFIG_ROUTELOOM_CONFIG=y\n' >> sdkconfig
            printf 'CONFIG_ROUTELOOM_NODE_ID=0x2\n' >> sdkconfig
            printf 'CONFIG_ROUTELOOM_PEER_NODE_ID=0x1\n' >> sdkconfig
            printf 'CONFIG_ROUTELOOM_PEER_MAC="94:a9:90:6a:ee:c4"\n' >> sdkconfig
          fi
          if [ '${{ matrix.features }}' = endpoints_on ]; then
            # bridge_node opt-in: capability bits 3 (gateway_endpoint_v1)
            # and 4 (config_endpoint_v1) attach + advertise both endpoints.
            printf 'CONFIG_ROUTELOOM_CAPABILITY=0x1f\n' >> sdkconfig
          fi
          if [ '${{ matrix.features }}' = config_target_on ]; then
            # reference_node opt-in: the RCC1 permit journal endpoint.
            printf 'CONFIG_ROUTELOOM_CONFIG=y\n' >> sdkconfig
          fi
          if [ '${{ matrix.features }}' = maintenance_on ]; then
            # reference_node opt-in: the factory maintenance console
            # branch instead of the mesh (sdk-v1/07 §6 P7).
            printf 'CONFIG_ROUTELOOM_MAINTENANCE_CONSOLE=y\n' >> sdkconfig
          fi
          if [ '${{ matrix.features }}' = route_scoped ]; then
            # Gateway-scoped routing profile (issue #41); the gateway id,
            # tick and lease come from the Kconfig defaults.
            printf 'CONFIG_ROUTELOOM_ROUTE_GATEWAY_SCOPED=y\n' >> sdkconfig
          fi
          idf.py build
          if [ '${{ matrix.profile }}' = deep_sleep ]; then
            # Prove the kconfig symbol survived re-resolution and the
            # deep-sleep code path was actually compiled in.
            grep -q '^CONFIG_ROUTELOOM_DEEP_SLEEP=y' sdkconfig
          else
            ! grep -q '^CONFIG_ROUTELOOM_DEEP_SLEEP=y' sdkconfig
          fi
          if [ '${{ matrix.autonomy }}' = observe ]; then
            # Prove the autonomy symbols survived re-resolution and the
            # Observe-mode lane was actually compiled in.
            grep -q '^CONFIG_ROUTELOOM_DISCOVERY=y' sdkconfig
            grep -q '^CONFIG_ROUTELOOM_MIGRATION=1' sdkconfig
          elif [ '${{ matrix.autonomy }}' = discover ]; then
            # Paired bench cells run the discovery lane without migration.
            grep -q '^CONFIG_ROUTELOOM_DISCOVERY=y' sdkconfig
            ! grep -q '^CONFIG_ROUTELOOM_MIGRATION=[12]' sdkconfig
          else
            ! grep -q '^CONFIG_ROUTELOOM_DISCOVERY=y' sdkconfig
            ! grep -q '^CONFIG_ROUTELOOM_MIGRATION=[12]' sdkconfig
          fi
          case '${{ matrix.features }}' in
            endpoints_on|paired_bridge)
              # Prove the endpoint opt-in survived re-resolution: bits 3+4
              # on top of the 0x7 default, so both endpoints attach.
              grep -q '^CONFIG_ROUTELOOM_CAPABILITY=0x1f' sdkconfig
              ;;
            *) ! grep -q '^CONFIG_ROUTELOOM_CAPABILITY=0x1f' sdkconfig ;;
          esac
          case '${{ matrix.features }}' in
            config_target_on|paired_target)
              grep -q '^CONFIG_ROUTELOOM_CONFIG=y' sdkconfig
              ;;
            *) ! grep -q '^CONFIG_ROUTELOOM_CONFIG=y' sdkconfig ;;
          esac
          case '${{ matrix.features }}' in
            maintenance_on)
              grep -q '^CONFIG_ROUTELOOM_MAINTENANCE_CONSOLE=y' sdkconfig
              ;;
            *) ! grep -q '^CONFIG_ROUTELOOM_MAINTENANCE_CONSOLE=y' sdkconfig ;;
          esac
          case '${{ matrix.features }}' in
            route_scoped)
              # Prove the scoped symbols resolved to the product timers.
              grep -q '^CONFIG_ROUTELOOM_ROUTE_GATEWAY_SCOPED=y' sdkconfig
              grep -q '^CONFIG_ROUTELOOM_ROUTE_PERIOD_MS=5000$' sdkconfig
              grep -q '^CONFIG_ROUTELOOM_ROUTE_LIFETIME_MS=90000$' sdkconfig
              ;;
            *) ! grep -q '^CONFIG_ROUTELOOM_ROUTE_GATEWAY_SCOPED=y' sdkconfig ;;
          esac
          case '${{ matrix.features }}' in
            paired_bridge)
              grep -q '^CONFIG_ROUTELOOM_NODE_ID=0x1' sdkconfig
              grep -q '^CONFIG_ROUTELOOM_PEER_NODE_ID=0x2' sdkconfig
              grep -q '^CONFIG_ROUTELOOM_PEER_MAC="94:a9:90:7a:b5:60"' sdkconfig
              ;;
            paired_target)
              grep -q '^CONFIG_ROUTELOOM_NODE_ID=0x2' sdkconfig
              grep -q '^CONFIG_ROUTELOOM_PEER_NODE_ID=0x1' sdkconfig
              grep -q '^CONFIG_ROUTELOOM_PEER_MAC="94:a9:90:6a:ee:c4"' sdkconfig
              ;;
          esac
          idf.py size > build/size-report.txt
          # Static RAM report + headroom guard (docs/design/sdk-v1/ram-budget.md):
          # per-cell DRAM/IRAM use goes to the job summary and the artifact;
          # the cell fails when the internal RAM holding .bss/.data has less
          # free space than the per-target/app floor in the tool.
          idf.py size --format json2 --output-file build/size.json
          python3 "$GITHUB_WORKSPACE/tools/firmware_ram_report.py" build/size.json \
            --target '${{ matrix.target }}' --app '${{ matrix.app }}' \
            --cell '${{ matrix.app }}-${{ matrix.target }}-${{ matrix.profile }}-${{ matrix.autonomy }}-${{ matrix.features }}' \
            --json-out build/ram-report.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: firmware-${{ matrix.app }}-${{ matrix.target }}-${{ matrix.profile }}-${{ matrix.autonomy }}-${{ matrix.features }}
          path: |
            idf-commit.txt
            firmware/${{ matrix.app }}/build/*.bin
            firmware/${{ matrix.app }}/build/*.elf
            firmware/${{ matrix.app }}/build/*.map
            firmware/${{ matrix.app }}/build/size-report.txt
            firmware/${{ matrix.app }}/build/size.json
            firmware/${{ matrix.app }}/build/ram-report.json
            firmware/${{ matrix.app }}/build/log/*
            firmware/${{ matrix.app }}/sdkconfig
          retention-days: 30
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo build --workspace --release --all-targets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: host-tools-linux
          path: |
            host/target/release/routeloom-host
            host/target/release/routeloomctl
            host/target/release/routeloom-tui
            host/target/release/examples/gen_golden
            host/target/release/examples/gen_usb_golden
            host/Cargo.lock
          retention-days: 30
  fuzz:
    runs-on: ubuntu-latest
    # 11 targets x 60 s plus the build.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build coverage-guided fuzzers (Clang + ASan/UBSan)
        shell: bash
        run: |
          set -euo pipefail
          export CC=clang CXX=clang++
          cmake -S . -B build-fuzz -DROUTELOOM_BUILD_TESTS=ON \
            -DROUTELOOM_BUILD_FUZZERS=ON -DROUTELOOM_ENABLE_SANITIZERS=ON \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-fuzz --parallel 2 \
            --target fuzz_wire_frame fuzz_usb_codec fuzz_autonomy \
                     fuzz_endpoint fuzz_host_ops fuzz_migration fuzz_cose fuzz_rlres1 fuzz_sdkv1 \
                     fuzz_sdkv1_ead fuzz_sdkv1_join
      # Bounded CI-time fuzzing — NOT continuous fuzzing. Each target gets a
      # 60 s coverage-guided run over its seed corpus on top of the corpus
      # regression replay that ctest already runs on every platform. This is
      # a smoke that keeps the libFuzzer harnesses exercised and catches
      # shallow crashes; long-running fuzzing belongs to dedicated
      # infrastructure (e.g. OSS-Fuzz).
      - name: Bounded fuzz run (60 s per target)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fuzz-artifacts
          for target in wire_frame usb_codec autonomy endpoint host_ops migration cose rlres1 sdkv1 sdkv1_ead sdkv1_join; do
            echo "=== fuzz_${target} ==="
            # libFuzzer wants the corpus dir to exist; it also accumulates
            # newly discovered coverage units here for artifact upload.
            mkdir -p tests/fuzz/corpus/${target}
            ./build-fuzz/tests/fuzz/fuzz_${target} \
              tests/fuzz/corpus/${target} \
              -max_total_time=60 -rss_limit_mb=2048 \
              -artifact_prefix=fuzz-artifacts/ -print_final_stats=1
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          # Crash reproducer files (crash-*/leak-*/oom-*) written to
          # fuzz-artifacts/ by -artifact_prefix, plus the corpus the target
          # accumulated (including any newly discovered coverage units).
          name: fuzz-artifacts
          path: |
            fuzz-artifacts/
            tests/fuzz/corpus/
          retention-days: 30
