name: SDK build and tests
on:
  push:
    branches:
      - main
      - implementation/core-fixed-250
      - implementation/pre-hil-software
      - design/autonomous-mesh-issues-3-4-5
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Every job runs a stage of tools/check.py; `python3 tools/check.py ci
  # --dry-run` prints the same commands.
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [OFF, ON]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and test portable C/C++ SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.compiler }}' = clang ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          python3 tools/check.py core --sanitizers ${{ matrix.sanitizer }} | tee ctest-report-${{ matrix.compiler }}-san${{ matrix.sanitizer }}.txt
      - name: C++ test inventory
        if: always()
        shell: bash
        run: |
          {
            echo '### Portable C++ test targets'
            echo ''
            echo 'Covers: wire codec, wire golden vectors (valid + invalid), routing'
            echo '(3hop/diamond/10hop/partition-merge/loop-freedom), authority ledger'
            echo 'power-cut, USB codec/session/credit, power coordinator model,'
            echo 'replay/end-protection hardening, C ABI, autonomy codecs + golden'
            echo 'vectors, neighbor discovery, congestion scheduler/BUSY, channel-plan'
            echo 'coordinator, migration engine + wire transport, load-aware routing.'
            echo ''
            echo '```'
            ctest --test-dir build -N || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install API1 schema validator
        run: python3 -m pip install jsonschema==4.25.1
      - name: Documentation and contract tests
        run: python3 tools/check.py docs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-report-${{ matrix.compiler }}-san${{ matrix.sanitizer }}
          path: ctest-report-*.txt
          retention-days: 30
  wire-golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Rust toolchain (host/rust-toolchain.toml)
        working-directory: host
        run: cargo --version
      - name: Vector generator dependency
        run: python3 -c "import cryptography" 2>/dev/null || pip install "cryptography==44.0.0"
      - name: C++/Rust golden-vector tests and byte-identical regeneration
        run: python3 tools/check.py golden
  firmware-cells:
    # The firmware matrix is tools/ci/cells.json (app, target, sdkconfig
    # overlay and assertions, size budget per cell).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.cells.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: cells
        run: python3 tools/check.py firmware --list --format github >> "$GITHUB_OUTPUT"
  firmware:
    needs: firmware-cells
    name: firmware (${{ matrix.id }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.firmware-cells.outputs.matrix) }}
    container:
      image: espressif/idf:v6.0.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the cell, assert its sdkconfig and check its budget
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          git -C "$IDF_PATH" rev-parse HEAD | tee idf-commit.txt
          test "$(cat idf-commit.txt)" = 76f5dedd9950a3012fee8fb7d5586df21fc67802
          python3 tools/check.py firmware --cell "${{ matrix.id }}"
      - name: Build HIL weak-link image
        if: matrix.id == 'bridge_node-esp32c3-normal-off-off' || matrix.id == 'experimental-c6-bridge_node-member'
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          cp sdkconfig sdkconfig.hil
          cat >> sdkconfig.hil <<'EOF'
          CONFIG_ROUTELOOM_TX_POWER_QDBM=8
          CONFIG_ROUTELOOM_HIL_RX_MIN_RSSI=-80
          CONFIG_ROUTELOOM_HIL_RX_DROP_PERMILLE=100
          EOF
          idf.py -B build-hil -D SDKCONFIG=sdkconfig.hil reconfigure
          cmake --build build-hil -j4
          for setting in CONFIG_ROUTELOOM_TX_POWER_QDBM=8 CONFIG_ROUTELOOM_HIL_RX_MIN_RSSI=-80 CONFIG_ROUTELOOM_HIL_RX_DROP_PERMILLE=100; do
            grep -Fqx "$setting" sdkconfig.hil
          done
          idf.py -B build-hil size --format json2 --output-file build-hil/size.json
          python3 ../../tools/firmware_ram_report.py build-hil/size.json \
            --target '${{ matrix.target }}' --app '${{ matrix.app }}' \
            --cell '${{ matrix.id }}-hil' --json-out build-hil/ram-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: |
            idf-commit.txt
            ${{ matrix.dir }}/build/*.bin
            ${{ matrix.dir }}/build/*.elf
            ${{ matrix.dir }}/build/*.map
            ${{ matrix.dir }}/build/size-report.txt
            ${{ matrix.dir }}/build/size.json
            ${{ matrix.dir }}/build/ram-report.json
            ${{ matrix.dir }}/build/log/*
            ${{ matrix.dir }}/sdkconfig
            ${{ matrix.dir }}/build-hil/*.bin
            ${{ matrix.dir }}/build-hil/*.elf
            ${{ matrix.dir }}/build-hil/size.json
            ${{ matrix.dir }}/build-hil/ram-report.json
            ${{ matrix.dir }}/sdkconfig.hil
          retention-days: 30
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Rust toolchain (host/rust-toolchain.toml)
        working-directory: host
        run: cargo --version
      - run: python3 tools/check.py rust
      - name: Generate Rust API reference
        working-directory: host
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --workspace --no-deps --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: routeloom-rust-reference
          path: host/target/doc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: host-tools-linux
          path: |
            host/target/release/routeloom-host
            host/target/release/routeloomctl
            host/target/release/routeloom-tui
            host/target/release/examples/gen_golden
            host/target/release/examples/gen_usb_golden
            host/Cargo.lock
          retention-days: 30
  profiles:
    # Portable suites per resource profile (tools/check.py PROFILE_BUILDS).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build: [build-endpoint, build-relay32, build-relay96, build-gateway-small]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 tools/check.py profiles --build ${{ matrix.build }}
  profile-mesh:
    # Owner mesh E2E with a gateway_small gateway, an endpoint and a relay
    # member (join, unicast, multi-hop, GK, cutover, role refusal; a skip fails).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Rust toolchain (host/rust-toolchain.toml)
        working-directory: host
        run: cargo --version
      - run: python3 tools/check.py profile-mesh
      - name: AppObject ON, dedup32 and OFF relay/terminal (a skip fails)
        run: python3 tools/check.py object-mesh
  fuzz:
    runs-on: ubuntu-latest
    # 12 targets x 60 s plus the build.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Bounded CI-time fuzzing — NOT continuous fuzzing. Each target gets a
      # 60 s coverage-guided run over its seed corpus on top of the corpus
      # regression replay that ctest already runs on every platform.
      - name: Build fuzzers (Clang + ASan/UBSan) and run 60 s per target
        run: python3 tools/check.py fuzz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          # Crash reproducer files (crash-*/leak-*/oom-*) written to
          # fuzz-artifacts/ by -artifact_prefix, plus the corpus the target
          # accumulated (including any newly discovered coverage units).
          name: fuzz-artifacts
          path: |
            fuzz-artifacts/
            tests/fuzz/corpus/
          retention-days: 30
