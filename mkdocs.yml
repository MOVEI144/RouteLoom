# RouteLoom documentation site (issue #15).
# Deployed to https://movei144.github.io/RouteLoom/ by .github/workflows/pages.yml.
# docs_dir is docs/: no document file is moved or renamed for the site.
site_name: RouteLoom 文書
site_description: 組み込み向け適応Mesh SDK（ESP32-C3/S3/C5、ESP-NOW）の設計・実装文書。実装プロトタイプでありRF・本番認定は未完了。
site_url: https://movei144.github.io/RouteLoom/
repo_name: MOVEI144/RouteLoom
repo_url: https://github.com/MOVEI144/RouteLoom
edit_uri: edit/main/docs/
docs_dir: docs
copyright: Copyright &copy; 2026 RouteLoom contributors — Apache-2.0

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit

plugins:
  # Japanese segmentation ships with mkdocs (lunr.ja.js); the index is built
  # client-side, so no extra Python packages are needed.
  - search:
      lang: ja
      separator: '[\s\-\.,:;\(\)\[\]{}「」『』、。・？！!?／/:;]+'

# Rewrites ../ links that escape docs/ into github.com blob URLs, and serves
# about.md from the repository-root README.md. See the file for details.
hooks:
  - tools/mkdocs_hooks.py

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Navigation mirrors the reading order (読み順) of docs/README.md.
nav:
  - 文書案内: README.md
  - RouteLoomについて: about.md
  - はじめに読む:
    - 実装案内（v0.1実装）: implementation/README.md
    - 全体仕様・SDKの責任境界: spec/overview.md
    - アーキテクチャと実行モデル: spec/architecture.md
    - 実装状況とリリース条件: STATUS.md
  - 仕様:
    - 組み込みSDK APIの契約: spec/sdk-api.md
    - 配送保証・キュー・永続化: spec/delivery-storage.md
    - Edge PC接続サービスとクライアントAPI: spec/host.md
    - Identity・参加・離脱・再接続: spec/identity-membership.md
    - セキュリティ契約: spec/security.md
    - 管理合意・Controller・設定世代: spec/control-plane.md
    - 無線サブシステム（ESP-NOW / Wi-Fi LR）: spec/radio.md
    - 干渉調査と協調チャンネル移行: spec/channel-migration.md
    - 経路制御・複数出口・分断修復: spec/routing.md
    - 省電力・Deep Sleep・受信可用性: spec/power.md
    - 無線Wire形式と版管理: spec/wire-protocol.md
    - USB／Serial transport契約: spec/usb-protocol.md
    - 遠隔設定・診断転送・ファーム更新: spec/remote-management.md
    - CLI・TUI・観測契約: spec/diagnostics.md
    - 受入試験・性能・失敗注入: spec/acceptance.md
    - 実装順序と公開計画: spec/implementation-plan.md
    - 実装プロファイルと機能の成熟度: spec/release-profiles.md
    - 電源断・時刻・受理資源の横断契約: spec/crash-time-resources.md
    - 資源・preauth・board資格のプロファイル: spec/resource-profiles.md
    - 設計判断と統合時の整合性: spec/decisions.md
    - 互換性・版管理ポリシー: spec/compatibility.md
    - Transport境界・将来のLoRa追加: spec/transport-extension.md
    - 用語: spec/glossary.md
  - ハードウェア:
    - hardware/README.md
    - XIAO ESP32-C3: hardware/xiao-esp32c3.md
    - XIAO ESP32-S3: hardware/xiao-esp32s3.md
    - XIAO ESP32-C5: hardware/xiao-esp32c5.md
    - XIAO ESP32-S3＋Wio-SX1262 B2B: hardware/xiao-esp32s3-wio-sx1262.md
    - 電源・RF・適合確認: hardware/power-rf-compliance.md
  - 実装ガイド:
    - コンポーネント配布と外部プロジェクトからの利用: implementation/component-distribution.md
    - Hardware-in-the-loop (HIL) harness: hil.md
  - リファレンス:
    - 公式資料と参照実装: references/official-sources.md
    - radio-defaults.json: reference/radio-defaults.json
    - boards.json: reference/boards.json
    - requirements.json: reference/requirements.json
    - feature-profiles.json: reference/feature-profiles.json
    - resource-profiles.json: reference/resource-profiles.json
    - review-disposition.json: reference/review-disposition.json
