[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routeloom-meshviz"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "pyqtgraph>=0.13,<1", "pyserial>=3.5,<4", "esptool==5.4.0"]

[tool.setuptools.packages.find]
where = ["src"]
