[workspace]
members = [
    "routeloom-protocol",
    "routeloom-wire",
    "routeloom-host",
    "routeloomctl",
    "routeloom-tui",
    "routeloom-json",
    "routeloom-peercred",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[workspace.lints.rust]
unsafe_code = "forbid"
