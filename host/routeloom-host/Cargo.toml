[package]
name = "routeloom-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
routeloom-protocol = { path = "../routeloom-protocol" }
routeloom-json = { path = "../routeloom-json" }
routeloom-peercred = { path = "../routeloom-peercred" }
# CAP-I1 durable OperationStore backend (04-capacity-storage.md §3: local
# SQLite transactional adapter, no external DB service). Bundled amalgamation
# keeps the daemon free of a system sqlite dependency. rusqlite MIT,
# SQLite public-domain; exact versions pinned in Cargo.lock. The `hooks`
# feature is used only by tests to veto a commit (fault injection).
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }

[dev-dependencies]
# The TUI's parser validates that the JSON this daemon emits stays compatible
# with the client data model — one protocol, not two.
routeloom-tui = { path = "../routeloom-tui" }

[lints]
workspace = true
