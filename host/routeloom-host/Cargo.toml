[package]
name = "routeloom-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
routeloom-protocol = { path = "../routeloom-protocol" }
routeloom-json = { path = "../routeloom-json" }
routeloom-peercred = { path = "../routeloom-peercred" }
# P5 config issuer: the RCC1 command, snapshot/patch TLV and Control
# challenge/status codecs live in routeloom-wire (the golden-tested mirror
# of the device endpoint codecs) — reused, never re-implemented.
routeloom-wire = { path = "../routeloom-wire" }
# CAP-I1 durable OperationStore backend (04-capacity-storage.md §3: local
# SQLite transactional adapter, no external DB service). Bundled amalgamation
# keeps the daemon free of a system sqlite dependency. rusqlite MIT,
# SQLite public-domain; exact versions pinned in Cargo.lock. The `hooks`
# feature is used only by tests to veto a commit (fault injection).
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
# SDK v1 Site Authority (docs/design/sdk-v1/07, plan P3-3): the EDHOC
# Responder (pure Rust, byte-exact with the device's libedhoc — see
# protocol/edhoc-interop), the join EAD codecs and the RLCW1 / RRS1 /
# signer seam of the office tooling. No second copy of any of them.
routeloom-edhoc = { path = "../routeloom-edhoc" }
routeloom-join = { path = "../routeloom-join" }
routeloom-provision = { path = "../routeloom-provision" }

[dev-dependencies]
# The TUI's parser validates that the JSON this daemon emits stays compatible
# with the client data model — one protocol, not two.
routeloom-tui = { path = "../routeloom-tui" }
# Same rule for the application facade: its API1 backend must parse the
# node objects and membership events this daemon actually emits.
routeloom-client = { path = "../routeloom-client" }

[lints]
workspace = true
